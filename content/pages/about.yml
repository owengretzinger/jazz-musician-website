title: Mattaus Gretzinger
subtitle: About Me
paragraph: >-
  Mattaus Gretzinger is a saxophonist, composer and teacher based in Toronto,
  Canada.


  Born in Oakville, Ontario, began playing saxophone in 7th grade, learning about jazz and discovering his love for musicians like Sonny Stitt, Ahmad Jamal and John Coltrane. 


  He went on to study music at the University of Toronto under the Kinghorn scholarship, where he studied with Kelly Jefferson. He has also studied with Ben Solomon and Todd Delgiudice.


  He can be found performing around Toronto at venues like The Rex, Jazz Bistro, Reservoir Lounge, as well as weddings and corporate events. Mattaus is experienced in performing in various types of ensemble, including small combo, big band, wedding band and solo saxophone performance.


  Mattaus has had the pleasure of sharing the stage with the likes of Terri Lynne Carrington, Kirk Macdonald, Virgina Macdonald, Robi Botos, Lorne Lofsky, Andrew Marzatto, Jacob Chung and more. His goal is to play lyrical, emotional solos that are creative and swinging.


  Mattaus is also a music teacher at Snider School of Music, as well as taking on his own students as a freelancer.
